<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer List</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Customer List</h1>
        <a href="{% url 'customer_create' %}" class="btn btn-primary">Add New Customer</a>
        <ul>
            {% for customer in customers %}
                <li>
                    <span>{{ customer.name }}</span>
                    <span>
                        <a href="{% url 'customer_detail' customer.id %}" class="btn btn-primary">View</a>
                        <a href="{% url 'customer_edit' customer.id %}" class="btn btn-secondary">Edit</a>
                        <a href="{% url 'customer_delete' customer.id %}" class="btn btn-danger" data-confirm="Are you sure you want to delete this customer?">Delete</a>
                    </span>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
