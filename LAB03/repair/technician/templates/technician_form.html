<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ form.instance.id|yesno:"Edit Technician,Add New Technician" }}</title>
    <link rel="stylesheet" href="/static/technician_styles.css">
    <script src="/static/technician_scripts.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>{{ form.instance.id|yesno:"Edit Technician,Add New Technician" }}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'technician_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
