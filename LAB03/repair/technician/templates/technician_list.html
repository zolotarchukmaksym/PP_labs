<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Technician List</title>
    <link rel="stylesheet" href="/static/technician_styles.css">
    <script src="/static/technician_scripts.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Technician List</h1>
        <div class="button-container">
            <a href="{% url 'technician_add' %}" class="btn btn-primary">Add New Technician</a>
        </div>
        <ul class="technician-list">
            {% for technician in technicians %}
                <li>
                    <span>{{ technician.name }}</span>
                    <span class="actions">
                        <a href="{% url 'technician_detail' technician.id %}" class="btn btn-info">View</a>
                        <a href="{% url 'technician_edit' technician.id %}" class="btn btn-secondary">Edit</a>
                        <a href="{% url 'technician_delete' technician.id %}" class="btn btn-danger" data-confirm="Are you sure you want to delete this technician?">Delete</a>
                    </span>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
