<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Technician</title>
    <link rel="stylesheet" href="/static/technician_styles.css">
    <script src="/static/technician_scripts.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Are you sure you want to delete this technician?</h1>
        <p><strong>Name:</strong> {{ technician.name }}</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'technician_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
