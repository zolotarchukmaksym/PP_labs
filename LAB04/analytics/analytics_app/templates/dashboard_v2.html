<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard v2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.bokeh.org/bokeh/release/bokeh-3.4.3.min.css">
    <script src="https://cdn.bokeh.org/bokeh/release/bokeh-3.4.3.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Dashboard v2</h1>
        <form method="get" class="mb-4">
            <div class="row">
                <div class="col-md-4">
                    <select name="chart_type" class="form-select">
                        <option value="all" {% if chart_type == 'all' %}selected{% endif %}>All</option>
                        <option value="bar" {% if chart_type == 'bar' %}selected{% endif %}>Bar Charts</option>
                        <option value="pie" {% if chart_type == 'pie' %}selected{% endif %}>Pie Charts</option>
                        <option value="line" {% if chart_type == 'line' %}selected{% endif %}>Line Charts</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary">Filter</button>
                </div>
            </div>
        </form>
        <div class="row">
            {% for key, plot in plots.items %}
                <div class="col-md-6 mb-4">
                    <div class="card">
                        <div class="card-body">
                            {{ plot.script|safe }}
                            {{ plot.div|safe }}
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
